name: guessmyfart
description: "Guess My Fart — devine le pet de tes potes en l'imitant à la bouche."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^6.2.0              # capture audio — en WAV, pour pouvoir analyser
  audioplayers: ^6.1.0        # lecture
  path_provider: ^2.1.4       # dossier local
  uuid: ^4.5.0
  intl: ^0.19.0
  supabase_flutter: ^2.9.0    # auth anonyme, base, stockage
  http: ^1.2.0                # lecture des blobs web pour l'upload

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
